<!DOCTYPE html>
<html>

    <head>
        <!-- Source - https://stackoverflow.com/a/34529962 -->
        <!-- Posted by Ramesh Ponnada -->
        <!-- Retrieved 2026-04-15, License - CC BY-SA 3.0 -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/4.1.2/papaparse.min.js"></script> <!-- Maybe download the  papa parse (like on stack overflow)-->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script> <!-- https://www.chartjs.org/docs/latest/getting-started/installation.html (link incase I change to using npm to download)-->
        
        <style>
            h1 {font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; font-size:50px; text-align: center; font-weight: 600; color: #f1f5f9;}

            body { background: #1c1c1c;}

            .feed {position: relative; margin: 24px 0; display: flex; flex-direction: column; gap: 14px;}
            .feed-item {display: flex; align-items: center; gap: 16px; padding: 4px 0; font-family: -apple-system, sans-serif; font-size: 20px; color: #f1f5f9; border: 1px solid #263044; border-radius: 8px;}
            .feed-item:hover {background: #475e83}
            .feed-time {width: 220px; white-space: nowrap; text-align: right; color: #f1f5f9; flex-shrink: 0; font-family: -apple-system, sans-serif; font-size: 20px;}
            .feed-dot {width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px #f1f5f9}

            #dateFilter, #hourFilter {font-size: 20px; padding: 8px 12px; border-radius: 1px; border-color: white; background: black; color: #f1f5f9;}
        
        </style>
    </head>

    <body>
        <h1>Activity Inference Dashboard</h1>

        <select id="dateFilter">
            <option value="all">All dates</option>
        </select>

        <select id="hourFilter">
            <option value="all">All hours</option>
        </select>

        <div style="display: flex; gap: 40px; align-items: flex-start;">
            <div style = "flex: 1">
                <div class="feed" id = "feed"></div>
            </div>
            <div style="width: 1400px; flex-shrink:0;">
                <div style="display: flex; gap: 24px; align-items: flex-start;"> 
                    <div style="flex: 1;"><canvas id="numOfActivitiesBar"></canvas></div>
                    <div style="flex: 1;"><canvas id="numOfActivitiesPie"></canvas></div>
            </div>
                <canvas id="packetCount"></canvas>

            </div>
        </div>


        <div style="width: 1700px;"><canvas id="numOfActivities"></canvas>
        <div class="feed" id="feed"></div>

        <script>
            Chart.defaults.color = '#f1f5f9';

            
            csvFile = "data/realMorningData.csv";
            let allData = [];
            Papa.parse(csvFile, {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: ({data}) => {
                    allData = data.filter(row => row.label && row.label != "undefined")
                    const dates = [...new Set(allData.map(row => new Date(row.windowStart * 1000).toLocaleDateString()))].sort();
                    const dateFilter = document.getElementById("dateFilter");
                    dates.forEach(date => dateFilter.innerHTML += `<option value = "${date}">${date}</option>`);
                    dateFilter.addEventListener("change", () => {
                        const val = dateFilter.value;
                        const hourFilter = document.getElementById("hourFilter");
                        hourFilter.innerHTML = `<option value="all">All hours</option>`;
                        if (val !== "all"){
                            const dayData = allData.filter(row => new Date(row.windowStart * 1000).toLocaleDateString() === val);
                            const hours = [...new Set(dayData.map(row => new Date(row.windowStart * 1000).getHours()))].sort((a,b) => a - b);

                            hours.forEach(hour => {
                                const label = `${String(hour).padStart(2, '0')}:00 - ${String(hour).padStart(2, '0')}:59`;
                                hourFilter.innerHTML += `<option value = "${hour}">${label}</option>`;
                            });
                            hourFilter.style.display = 'inline-block';
                            hourFilter.addEventListener("change", render);
                        }else{
                            hourFilter.style.display = "none";
                        }
                        render();
                    });
                    render();
                    console.log(data);
                }
            })

        function render(){
            const dateVal = document.getElementById("dateFilter").value;
            const hourVal = document.getElementById("hourFilter").value;

            let filtered = dateVal === "all" ? allData : allData.filter(row => new Date(row.windowStart * 1000).toLocaleDateString() === dateVal);

            if (hourVal !== "all"){
                filtered = filtered.filter(row => new Date(row.windowStart * 1000).getHours() === Number(hourVal));
            }

            buildCharts(filtered);
            buildFeed(filtered);
        }

            function buildCharts(data){
                Chart.getChart("numOfActivitiesBar")?.destroy();
                Chart.getChart("numOfActivitiesPie")?.destroy();
                Chart.getChart("packetCount")?.destroy();

                const displayName = {
                    bulbOn: "Bulb on",
                    bulbOff: "Bulb off",
                    bulbChange: "Bulb changed",
                    alexaBulbOn: "Alexa bulb on",
                    alexaBulbOff: "Alexa bulb off",
                    alexaBulbChange: "Alexa bulb change",
                    movingAroundHouse: "Motion inside",
                    outsideDetection: "Motion outside",
                    plugOn: "Plug on",
                    "plugOff": "Plug off"
                }

                const activityCount = {};
                data.forEach(row => {
                    activityCount[row.label] = (activityCount[row.label] || 0) + 1;
                });

                const labels = Object.keys(activityCount).map(label => displayName[label] || label).filter(label => label != "undefined");
                const values = Object.values(activityCount);

                const activityBar = document.getElementById("numOfActivitiesBar").getContext("2d");
                const activityPie = document.getElementById("numOfActivitiesPie").getContext("2d");
                new Chart(activityBar, {
                    type:"bar",
                    options:{
                        plugins:{
                            title: {
                                display:true,
                                text: "Bar graph showing the number of each events",
                                font: {size: 20}
                            }
                        }
                    },
                    data:{
                        labels: labels,
                        datasets: [{
                            label: "Activity Count",
                            data: values
                        }]
                    }
                })
                new Chart(activityPie, {
                    type:"pie",
                    options:{
                        plugins:{
                            title: {
                                display:true,
                                text: "Pie Chart showing the number of each events",
                                font: {size: 20}
                            }
                        }
                    },
                    data:{
                        labels: labels,
                        datasets: [{
                            label: "Activity Count",
                            data: values
                        }]
                    }
                })



                const sorted = [...data].sort((a,b) => a.windowStart - b.windowStart);
                const lineLabels = sorted.map(row => new Date(row.windowStart * 1000).toLocaleString());
                const lineValues = sorted.map (row => row.packetCount || 0);

                const packetLine = document.getElementById("packetCount").getContext("2d");
                new Chart(packetLine, {
                    type:"line",
                    options: {
                        scales: {
                            x: {ticks: {maxTicksLimit: 6}},
                            y: {type: 'logarithmic'}
                        },
                        plugins:{
                            title: {
                                display:true,
                                text: "Line Graph showing packet count over time",
                                font: {size: 20}
                            }
                        }
                    },
                    data:{
                        labels: lineLabels,
                        datasets: [{
                            label: "Packet Count",
                            data: lineValues,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 2
                        }]
                    },
                })
            }

            function buildFeed(data){
                const dotColours = {
                    bulbOn: "#4ade80",
                    bulbOff: "#c55050",
                    bulbChange: "#d6f50f",
                    alexaBulbOn: "#60d089",
                    alexaBulbOff: "#c55050",
                    alexaBulbChange: "#d6f50f",
                    movingAroundHouse: "#a147c5",
                    outsideDetection: "#851fad",
                    plugOn: "#4ade80",
                    plugOff: "#c55050"
                };

                const displayName = {
                    bulbOn: "Bulb turned on",
                    bulbOff: "Bulb turned off",
                    bulbChange: "Bulb brightness or colour changed",
                    alexaBulbOn: "Bulb turned on via Alexa",
                    alexaBulbOff: "Bulb turned off via Alexa",
                    alexaBulbChange: "Bulb brightness or colour changed via Alexa",
                    movingAroundHouse: "Motion detected inside the house",
                    outsideDetection: "Motion detected outside the house",
                    plugOn: "Plug turned on",
                    "plugOff": "Plug turned off"
                }

                const valid = data.filter(row => row.label && row.label != "undefined");
                const sorted = [...valid].sort((a,b) => b.windowStart - a.windowStart);

                document.getElementById("feed").innerHTML = sorted.map(row => {
                    const time = new Date(row.windowStart * 1000).toLocaleString();
                    const colour = dotColours[row.label] || "#000000";
                    return `<div class="feed-item" style="border-color: ${colour}70">
                        <span class="feed-time">${time}</span>
                        <span class="feed-dot" style="background:${colour}"></span>
                        <span class="feed-item-${row.label}">${displayName[row.label] || row.label}</span>
                        </div>`;
                }).join('');
            }
        </script>
    </body>
</html>
